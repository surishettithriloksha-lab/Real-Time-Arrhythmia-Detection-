[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwnn-arrhythmia"
version = "1.0.0"
description = "Patient-independent real-time arrhythmia detection with a CWNN"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "streamlit>=1.30"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
